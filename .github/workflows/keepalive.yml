name: Keep Render API awake

# Render's free web services spin down after ~15 minutes without traffic.
# This scheduled ping keeps Aura Chat's backend warm.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Aura Chat API
        env:
          API_URL: https://aura-chat-api-ogx9.onrender.com
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 120 "$API_URL/")
          echo "Aura Chat API responded with HTTP $code"
          test "$code" = "200"
